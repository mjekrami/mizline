apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mizline
spec:
  rules:
    - host: api.mizline.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3003
    - host: app.mizline.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kds
                port:
                  number: 3000
    - host: order.mizline.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kds
                port:
                  number: 3000

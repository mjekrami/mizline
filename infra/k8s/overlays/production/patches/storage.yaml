apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: mizline-local
$patch: delete
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mizline-postgres-pv
$patch: delete
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mizline-redis-pv
$patch: delete
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: gp3
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
spec:
  storageClassName: gp3
  resources:
    requests:
      storage: 5Gi

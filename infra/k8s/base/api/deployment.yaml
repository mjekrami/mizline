apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: mizline
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: mizline
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: migrate
          image: mizline/api:latest
          imagePullPolicy: IfNotPresent
          workingDir: /app/apps/api
          command:
            - /bin/sh
            - -c
            - npx prisma migrate deploy
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mizline-secrets
                  key: DATABASE_URL
      containers:
        - name: api
          image: mizline/api:latest
          imagePullPolicy: IfNotPresent
          workingDir: /app/apps/api
          ports:
            - name: http
              containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mizline-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: mizline-secrets
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mizline-secrets
                  key: JWT_SECRET
            - name: KITCHEN_DEV_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mizline-secrets
                  key: KITCHEN_DEV_TOKEN
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: mizline-config
                  key: CORS_ORIGINS
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 30

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mizline

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - namespace.yaml
  - storage/storageclass.yaml
  - storage/postgres-pv.yaml
  - storage/redis-pv.yaml
  - secrets/mizline-secrets.yaml
  - configmaps/mizline-config.yaml
  - postgres/configmap.yaml
  - postgres/statefulset.yaml
  - postgres/service.yaml
  - postgres/pdb.yaml
  - redis/pvc.yaml
  - redis/deployment.yaml
  - redis/service.yaml
  - api/deployment.yaml
  - api/service.yaml
  - api/pdb.yaml
  - api/hpa.yaml
  - kds/deployment.yaml
  - kds/service.yaml
  - kds/pdb.yaml
  - kds/hpa.yaml
  - ingress/ingress.yaml
  - network-policies/api.yaml

images:
  - name: mizline/api
    newName: mizline/api
    newTag: latest
  - name: mizline/kds
    newName: mizline/kds
    newTag: latest

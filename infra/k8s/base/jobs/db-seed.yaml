apiVersion: batch/v1
kind: Job
metadata:
  name: db-seed
  labels:
    app.kubernetes.io/name: db-seed
    app.kubernetes.io/part-of: mizline
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-seed
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: mizline/api:latest
          imagePullPolicy: IfNotPresent
          workingDir: /app/apps/api
          command:
            - /bin/sh
            - -c
            - npx prisma db seed
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mizline-secrets
                  key: DATABASE_URL

apiVersion: v1
kind: Secret
metadata:
  name: mizline-secrets
  labels:
    app.kubernetes.io/part-of: mizline
type: Opaque
stringData:
  # Replace before production deploy (or use Sealed Secrets / External Secrets).
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: mizline
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mizline?schema=public
  REDIS_URL: redis://redis:6379
  JWT_SECRET: change-me-in-production
  KITCHEN_DEV_TOKEN: dev-kitchen-token-change-me

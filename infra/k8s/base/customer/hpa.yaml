apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: customer
  labels:
    app.kubernetes.io/name: customer
    app.kubernetes.io/part-of: mizline
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: customer
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

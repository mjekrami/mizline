apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mizline
  labels:
    app.kubernetes.io/part-of: mizline
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Sticky sessions for Socket.IO until a Redis adapter is added to the API.
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/session-cookie-name: mizline-route
    nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
    nginx.ingress.kubernetes.io/session-cookie-path: /
    # Uncomment when cert-manager is installed:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: api.mizline.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3003
    - host: app.mizline.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kds
                port:
                  number: 3000
    - host: order.mizline.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kds
                port:
                  number: 3000
  # tls:
  #   - hosts:
  #       - api.mizline.local
  #       - app.mizline.local
  #       - order.mizline.local
  #     secretName: mizline-tls

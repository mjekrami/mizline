apiVersion: apps/v1
kind: Deployment
metadata:
  name: kitchen
  labels:
    app.kubernetes.io/name: kitchen
    app.kubernetes.io/part-of: mizline
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kitchen
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kitchen
        app.kubernetes.io/part-of: mizline
    spec:
      containers:
        - name: kitchen
          image: mizline/kitchen:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: KITCHEN_DEV_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mizline-secrets
                  key: KITCHEN_DEV_TOKEN
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 30
